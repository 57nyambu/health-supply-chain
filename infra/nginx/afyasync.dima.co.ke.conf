server {
    listen 80;
    listen [::]:80;
    server_name afyasync.dima.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afyasync.dima.co.ke;

    # Replace with your Let's Encrypt or managed cert paths
    ssl_certificate /etc/letsencrypt/live/afyasync.dima.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyasync.dima.co.ke/privkey.pem;

    # Documents up to DOCUMENT_MAX_BYTES (25 MB) plus multipart overhead.
    client_max_body_size 26m;

    # Next.js web app (infra/systemd/afyasync-web.service). Same origin as /api/ (ADR-005).
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    # Normalize the API root to the trailing-slash form.
    location = /api {
        return 301 /api/;
    }

    # Backend API under /api/
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_redirect off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
