# Development stack. Every published port is bound to 127.0.0.1 (DESIGN §16):
# PostgreSQL and Redis are never reachable from other machines.
# Usage: make services | make dev | make down   (reads ../.env when present)
name: afyasync

x-api-env: &api-env
  DJANGO_ENV: ${DJANGO_ENV:-dev}
  DATABASE_URL: postgres://${POSTGRES_USER:-afyasync}:${POSTGRES_PASSWORD:-afyasync}@postgres:5432/${POSTGRES_DB:-afyasync}
  REDIS_URL: redis://redis:6379/0
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "False"
  DATA_DIR: /data
  # MinIO stands in for the S3-compatible bucket in dev/CI (synthetic data only).
  S3_ENDPOINT_URL: http://minio:9000
  S3_REGION_NAME: us-east-1
  S3_BUCKET: ${S3_BUCKET:-afyasync-dev}
  S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-afyasync}
  S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-afyasync-dev-only}
  RESIDENCY_ALLOWED_HOSTS: minio,localhost,127.0.0.1

x-api: &api
  build:
    context: ..
    dockerfile: api/Dockerfile
    target: dev
  env_file:
    - path: ../.env
      required: false
  environment: *api-env
  volumes:
    - ../api:/app/api
    - ../data:/data
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    minio: { condition: service_started }

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-afyasync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afyasync}
      POSTGRES_DB: ${POSTGRES_DB:-afyasync}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.11-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # MinIO no longer publishes images on Docker Hub; pgsty/minio is a maintained community
    # rebuild of the same server, used for dev/CI only (DECISIONS.md, Findings 2026-10-15).
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-afyasync}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-afyasync-dev-only}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]

  mailpit:
    image: axllent/mailpit:v1.31.6
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  api:
    <<: *api
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py storage_init && python manage.py runserver 0.0.0.0:8000"]
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 30

  worker:
    <<: *api
    command: ["celery", "-A", "config.celery", "worker", "--loglevel", "INFO"]

  beat:
    <<: *api
    command: ["celery", "-A", "config.celery", "beat", "--loglevel", "INFO", "--schedule", "/tmp/celerybeat-schedule"]

  web:
    build:
      context: ../web
      target: dev
    environment:
      API_ORIGIN: http://api:8000
    volumes:
      - ../web:/app
      - /app/node_modules
      - /app/.next
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }

volumes:
  pgdata:
  miniodata:
