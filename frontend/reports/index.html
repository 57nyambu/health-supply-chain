<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfyaSync Reporter Dashboard</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="/assets/js/config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-stack">
          <h1 class="brand-title">AfyaSync</h1>
          <p id="page-title" class="brand-subtitle">Tier 3 Reporter Dashboard</p>
        </div>
        <div class="form-row">
          <span class="badge"><i class="bi bi-journal-text"></i> Read-only district reporting</span>
          <button id="logout-btn" class="btn btn-ghost">Logout</button>
        </div>
      </header>

      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="overview"><i class="bi bi-bar-chart"></i> District Overview</button>
        <button class="tab-btn" data-tab="alerts"><i class="bi bi-exclamation-triangle"></i> Alerts</button>
      </nav>

      <section id="overview" class="tab-panel active">
        <div id="stats-grid" class="grid grid-3"></div>
      </section>

      <section id="alerts" class="tab-panel">
        <div class="grid grid-2">
          <article class="card">
            <h3>Facility Alerts</h3>
            <div id="alerts-feed" class="grid"></div>
          </article>
          <article class="card">
            <h3>Inventory Alerts</h3>
            <div id="inventory-alert-feed" class="grid"></div>
          </article>
        </div>
      </section>
    </main>

    <script type="module">
      import { requireRole } from '../assets/js/auth.js';
      import { initReporterDashboard } from '../assets/js/dashboard.js';

      const user = requireRole(['REPORTER']);
      if (user) {
        initReporterDashboard();
      }
    </script>
  </body>
</html>
