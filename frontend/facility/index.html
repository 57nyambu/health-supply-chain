<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfyaSync Facility Dashboard</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="/assets/js/config.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand-stack">
          <h1 class="brand-title">AfyaSync</h1>
          <p id="page-title" class="brand-subtitle">Tier 2 Facility Dashboard</p>
        </div>
        <div class="form-row">
          <span class="badge"><i class="bi bi-hospital"></i> Facility-scoped view</span>
          <button id="logout-btn" class="btn btn-ghost">Logout</button>
        </div>
      </header>

      <nav class="nav-tabs">
        <button class="tab-btn active" data-tab="overview"><i class="bi bi-clipboard2-pulse"></i> My Facility</button>
        <button class="tab-btn" data-tab="assistant"><i class="bi bi-stars"></i> AI Assistant</button>
        <button class="tab-btn" data-tab="alerts"><i class="bi bi-bell"></i> Alerts</button>
        <button class="tab-btn" data-tab="ocr"><i class="bi bi-camera"></i> OCR Intake</button>
      </nav>

      <section id="overview" class="tab-panel active">
        <div id="stats-grid" class="grid grid-3"></div>
      </section>

      <section id="assistant" class="tab-panel">
        <article class="card chat-wrap">
          <h3>AI Assistant (Facility Scoped)</h3>
          <div id="assistant-feed" class="chat-feed"></div>
          <form id="assistant-form" class="form-row">
            <input id="assistant-query" class="input" placeholder="Ask about your facility stock and trends..." required />
            <button class="btn btn-primary" type="submit">Send</button>
          </form>
        </article>
      </section>

      <section id="alerts" class="tab-panel">
        <div class="grid grid-2">
          <article class="card">
            <h3>Facility Alerts</h3>
            <div id="alerts-feed" class="grid"></div>
          </article>
          <article class="card">
            <h3>Inventory Alerts</h3>
            <div id="inventory-alert-feed" class="grid"></div>
          </article>
        </div>
      </section>

      <section id="ocr" class="tab-panel">
        <article class="card">
          <h3>OCR Intake</h3>
          <form id="ocr-form" class="form-row">
            <input id="ocr-file" class="input" type="file" accept="image/*" required />
            <button class="btn btn-primary" type="submit">Process Image</button>
          </form>
          <pre id="ocr-result" class="card" style="margin-top: 10px; white-space: pre-wrap;"></pre>
        </article>
      </section>
    </main>

    <script type="module">
      import { requireRole } from '../assets/js/auth.js';
      import { initFacilityDashboard } from '../assets/js/dashboard.js';

      const user = requireRole(['BRANCH_MANAGER', 'WAREHOUSE', 'PROCUREMENT', 'CASHIER']);
      if (user) {
        initFacilityDashboard();
      }
    </script>
  </body>
</html>
