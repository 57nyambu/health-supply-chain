<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfyaSync Login</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="/assets/js/config.js"></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <div class="brand-stack">
          <h1 class="brand-title">AfyaSync</h1>
          <p class="brand-subtitle">Smart Health Extension for District Supply Coordination</p>
        </div>

        <p class="badge"><i class="bi bi-shield-lock"></i> JWT authentication enabled</p>

        <section class="card" style="padding: 14px; margin-bottom: 12px;">
          <p id="demo-status" class="muted" style="margin-top: 0;">Demo credentials will auto-fill in a few seconds.</p>
          <div id="demo-buttons" class="form-row" style="flex-wrap: wrap; gap: 8px;"></div>
        </section>

        <form id="login-form" class="grid" style="gap: 10px;">
          <label>
            <span>Email</span>
            <input id="email" class="input" type="email" required />
          </label>
          <label>
            <span>Password</span>
            <input id="password" class="input" type="password" required />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
          <p id="login-error" class="muted"></p>
        </form>
      </section>
    </main>

    <script type="module">
      import { login, routeByRole } from './assets/js/auth.js';

      const config = window.AFYASYNC_CONFIG || {};
      const demoLogins = Array.isArray(config.DEMO_LOGINS) ? config.DEMO_LOGINS : [];

      const form = document.getElementById('login-form');
      const errorNode = document.getElementById('login-error');
      const demoStatus = document.getElementById('demo-status');
      const demoButtons = document.getElementById('demo-buttons');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');

      function applyDemoLogin(profile, announce = true) {
        if (!profile) {
          return;
        }

        emailInput.value = profile.email || '';
        passwordInput.value = profile.password || '';

        if (announce && demoStatus) {
          demoStatus.textContent = `Loaded ${profile.label} demo login.`;
        }
      }

      if (demoButtons && demoLogins.length > 0) {
        demoButtons.innerHTML = '';
        demoLogins.forEach((profile, index) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = 'btn btn-ghost';
          button.textContent = profile.label || `Demo ${index + 1}`;
          button.addEventListener('click', () => applyDemoLogin(profile));
          demoButtons.appendChild(button);
        });

        window.setTimeout(() => applyDemoLogin(demoLogins[0]), 2200);
      } else if (demoStatus) {
        demoStatus.textContent = 'Demo credentials are not configured yet.';
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorNode.textContent = '';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        try {
          const user = await login(email, password);
          routeByRole(user);
        } catch (error) {
          errorNode.textContent = `Login failed: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
