<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AfyaSync Login</title>
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <script src="/assets/js/config.js"></script>
  </head>
  <body>
    <main class="login-shell">
      <section class="login-card">
        <div class="brand-stack">
          <h1 class="brand-title">AfyaSync</h1>
          <p class="brand-subtitle">Smart Health Extension for District Supply Coordination</p>
        </div>

        <p class="badge"><i class="bi bi-shield-lock"></i> JWT authentication enabled</p>

        <form id="login-form" class="grid" style="gap: 10px;">
          <label>
            <span>Email</span>
            <input id="email" class="input" type="email" required />
          </label>
          <label>
            <span>Password</span>
            <input id="password" class="input" type="password" required />
          </label>
          <button class="btn btn-primary" type="submit">Sign in</button>
          <p id="login-error" class="muted"></p>
        </form>
      </section>
    </main>

    <script type="module">
      import { login, routeByRole } from './assets/js/auth.js';

      const form = document.getElementById('login-form');
      const errorNode = document.getElementById('login-error');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        errorNode.textContent = '';

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        try {
          const user = await login(email, password);
          routeByRole(user);
        } catch (error) {
          errorNode.textContent = `Login failed: ${error.message}`;
        }
      });
    </script>
  </body>
</html>
