components:
  schemas:
    AlertTypeEnum:
      enum:
      - understaffed
      - low_footfall
      - overcrowded
      - stockout_risk
      - custom
      type: string
      description: |-
        * `understaffed` - Understaffed
        * `low_footfall` - Low Footfall
        * `overcrowded` - Overcrowded
        * `stockout_risk` - Stock-Out Risk
        * `custom` - Custom
    Auth:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    AuthRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    BinLocation:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        warehouse_name:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        name:
          type: string
          maxLength: 50
        bin_type:
          $ref: '#/components/schemas/BinTypeEnum'
        barcode:
          type: string
          maxLength: 50
        qr_code:
          type:
          - string
          - 'null'
          format: uri
        capacity:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Max items that can be stored
        notes:
          type: string
        warehouse:
          type: integer
      required:
      - created_at
      - id
      - name
      - updated_at
      - warehouse
      - warehouse_name
    BinLocationRequest:
      type: object
      properties:
        is_active:
          type: boolean
        name:
          type: string
          minLength: 1
          maxLength: 50
        bin_type:
          $ref: '#/components/schemas/BinTypeEnum'
        barcode:
          type: string
          maxLength: 50
        qr_code:
          type: string
          format: binary
        capacity:
          type:
          - integer
          - 'null'
          maximum: 2147483647
          minimum: 0
          description: Max items that can be stored
        notes:
          type: string
        warehouse:
          type: integer
      required:
      - name
      - warehouse
    BinTypeEnum:
      enum:
      - SHELF
      - PALLET
      - BIN
      - ROOM
      type: string
      description: |-
        * `SHELF` - Shelf
        * `PALLET` - Pallet
        * `BIN` - Storage Bin
        * `ROOM` - Storage Room
    Branch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        name:
          type: string
          maxLength: 100
        code:
          type: string
          maxLength: 10
        kra_pin:
          type: string
          pattern: ^[A-Z]{1}\d{9}[A-Z]{1}$
          maxLength: 11
        business_reg_no:
          type: string
          title: Business Registration Number
          maxLength: 20
        vat_no:
          type: string
          title: VAT Number
          maxLength: 20
        county:
          $ref: '#/components/schemas/CountyEnum'
        physical_address:
          type: string
        postal_address:
          type: string
          maxLength: 100
        contact_phone:
          type: string
          pattern: ^\+254\d{9}$
          maxLength: 15
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        manager:
          type:
          - integer
          - 'null'
      required:
      - business_reg_no
      - code
      - contact_phone
      - county
      - created_at
      - id
      - kra_pin
      - name
      - physical_address
      - updated_at
    BranchRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        code:
          type: string
          minLength: 1
          maxLength: 10
        kra_pin:
          type: string
          minLength: 1
          pattern: ^[A-Z]{1}\d{9}[A-Z]{1}$
          maxLength: 11
        business_reg_no:
          type: string
          minLength: 1
          title: Business Registration Number
          maxLength: 20
        vat_no:
          type: string
          title: VAT Number
          maxLength: 20
        county:
          $ref: '#/components/schemas/CountyEnum'
        physical_address:
          type: string
          minLength: 1
        postal_address:
          type: string
          maxLength: 100
        contact_phone:
          type: string
          minLength: 1
          pattern: ^\+254\d{9}$
          maxLength: 15
        contact_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        is_active:
          type: boolean
        manager:
          type:
          - integer
          - 'null'
      required:
      - business_reg_no
      - code
      - contact_phone
      - county
      - kra_pin
      - name
      - physical_address
    Category:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_active:
          type: boolean
        name:
          type: string
          maxLength: 100
        description:
          type: string
        vat_category:
          $ref: '#/components/schemas/VatCategoryEnum'
      required:
      - created_at
      - id
      - name
      - updated_at
    CategoryRequest:
      type: object
      properties:
        is_active:
          type: boolean
        name:
          type: string
