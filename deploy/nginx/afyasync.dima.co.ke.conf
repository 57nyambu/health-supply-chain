server {
    listen 80;
    listen [::]:80;
    server_name afyasync.dima.co.ke;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name afyasync.dima.co.ke;

    # Replace with your Let's Encrypt or managed cert paths
    ssl_certificate /etc/letsencrypt/live/afyasync.dima.co.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/afyasync.dima.co.ke/privkey.pem;

    client_max_body_size 10m;
    root /home/afya-front/frontend/dist;
    index index.html;

    # Frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API under /api/
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
